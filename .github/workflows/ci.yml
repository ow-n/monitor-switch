name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install development linter
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Analyze
        shell: pwsh
        run: |
          $issues = Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          if ($issues) {
            $issues | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
            throw "PSScriptAnalyzer found $($issues.Count) issue(s)."
          }
          Write-Host 'Clean.'

      - name: Validate module manifest
        shell: pwsh
        run: Test-ModuleManifest ./src/Module/MonitorSwitch.psd1 | Format-List Name, Version, ExportedFunctions

      - name: Test HDR lockout without changing display settings
        shell: powershell
        run: .\tests\test-hdr-lockout.ps1

      - name: Test the portable launchers and isolated setups
        shell: powershell
        run: .\tests\test-setups.ps1

      - name: Test profile input handoffs without physical monitors
        shell: powershell
        run: .\tests\test-input-routing.ps1
