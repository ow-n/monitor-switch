# monitors.yaml - Monitor Switch configuration
#
# Copy to %LOCALAPPDATA%\MonitorSwitch\monitors.yaml to customise per-machine.
# `install.ps1` does this for you.

version: 1

# ---------------------------------------------------------------------------
# Refresh rate policy
# ---------------------------------------------------------------------------
# Applied after every profile switch, because restoring a layout snapshot also
# restores whatever refresh rate was captured in it.
#
#   safe   - cap every display at safeHz (default). Lowest display-engine and
#            PCIe bandwidth. Use this when the GPU is unstable: high refresh
#            across several large panels is a known trigger for
#            0x116 VIDEO_TDR_FAILURE on bandwidth-starved links.
#   max    - drive every display to its highest supported rate.
#   native - leave whatever Windows currently has set.
#
# Resolution is never changed. Only refresh rate.
refresh:
  policy: safe
  safeHz: 60

  # Per-display exceptions, matched against the monitor name (substring, case
  # insensitive). First match wins. Useful to let one panel run fast while the
  # rest stay capped.
  #   overrides:
  #     - match: "MPG341"
  #       hz: 100
  overrides: []

# ---------------------------------------------------------------------------
# Physical layout
# ---------------------------------------------------------------------------
# Panel size drives the grid maths. Columns and rows are derived from each
# display's desktop position, NOT from DisplayId - Windows renumbers DisplayIds
# whenever a monitor is added or removed, so geometry is the stable key.
#
# Columns are named left -> right, rows top -> bottom, based on how many
# distinct positions actually exist:
#   2 columns -> left, right          2 rows -> top, bottom
#   3 columns -> left, middle, right  3 rows -> top, middle, bottom
layout:
  panelWidth: 3440
  panelHeight: 1440

# ---------------------------------------------------------------------------
# Profiles
# ---------------------------------------------------------------------------
# Each profile chooses which displays STAY active. Everything else is disabled
# (freeing those inputs for another machine).
#
#   select: all              -> full restore from the baseline snapshot
#   select: { columns: [...], rows: [...] }
#                            -> keep displays in those columns/rows.
#                               Omitting a key means "any".
#   primary:                 -> which kept display becomes primary.
#                               A row name, a column name, both, or `first`.
profiles:
  all:
    description: Full restore - every monitor back on
    select: all

  left:
    description: LEFT column only - hands the rest to the laptop
    select:
      columns: [left]
    primary:
      row: bottom

  middle:
    description: MIDDLE column only
    select:
      columns: [middle]
    primary:
      row: bottom

  left-middle:
    description: LEFT + MIDDLE columns - frees the right column
    select:
      columns: [left, middle]
    primary:
      column: middle
      row: bottom

  top-left:
    description: Single TOP-LEFT monitor - frees everything else
    select:
      columns: [left]
      rows: [top]
    primary: first

# ---------------------------------------------------------------------------
# Desktop shortcuts generated by `monitor-switch shortcuts`
# ---------------------------------------------------------------------------
shortcuts:
  enabled: true
  # Where the .bat files are written. Supports environment variables.
  directory: "%USERPROFILE%\\Documents\\Tools\\Monitors\\shortcuts"
